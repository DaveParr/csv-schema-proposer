[project]
name = "csv-schema-proposer"
version = "0.1.0"
description = "Propose a pandera schema for a CSV using a tiny local model"
jac-version = "==0.38.2"
default-app = "csv-schema-proposer"

[dependencies]

[dev-dependencies]
[dev-dependencies.pypi]
watchdog = ">=3.0.0"

[dependencies.pypi]
pandas = "~=3.1"
pandera = "~=0.35"

# Declares the byLLM capability so `jac install` pulls litellm. The model the
# app actually calls is set in propose.jac (override: LLM_MODEL env or --model).
[byllm.model]
default_model = "${LLM_MODEL:-ollama/qwen2.5:1.5b}"

[byllm.call_params]
temperature = 0.1

[test]
directory = "tests"

[apps.csv-schema-proposer]
kind = "cli"
entry-point = "main"

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.web.dependencies.npm]
jac-client-node = "1.0.7"

[apps.web.dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"
